buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

def notifeePackageJson = ["node", "--print", "require.resolve('@notifee/react-native/package.json')"].execute(null, rootDir).text.trim()
def notifeeMavenRepo = new File(new File(notifeePackageJson).getParentFile(), "android/libs")

allprojects {
    repositories {
        maven {
            // Needed in some monorepo/hoisted installs so app.notifee:core resolves.
            url(notifeeMavenRepo.toURI())
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
